# Use the latest 2.1 version of CircleCI pipeline process engine.
# See: https://circleci.com/docs/2.0/configuration-reference
version: 2.1

# Install the same reviewed Pixi release in every locked-environment job. Keep this as a
# reusable command so the comparator and general Python gates cannot drift onto different
# installers when their branches are integrated.
commands:
  install-pinned-pixi:
    steps:
      - run:
          name: Install pinned Pixi 0.47.0
          command: |
            readonly pixi_version="0.47.0"
            readonly pixi_archive="/tmp/pixi-x86_64-unknown-linux-musl.tar.gz"
            readonly pixi_sha256="9ca7b313a814f7ffc4bdc673f8fddef48a525a3d5da2e592559ba6ade8709e92"
            curl --fail --location --silent --show-error \
              --output "$pixi_archive" \
              "https://github.com/prefix-dev/pixi/releases/download/v${pixi_version}/pixi-x86_64-unknown-linux-musl.tar.gz"
            echo "$pixi_sha256  $pixi_archive" | sha256sum --check --strict
            tar -xzf "$pixi_archive" -C /tmp pixi
            test "$(/tmp/pixi --version)" = "pixi $pixi_version"
            sudo install -m 0755 /tmp/pixi /usr/local/bin/pixi

# Define a job to be invoked later in a workflow.
# See: https://circleci.com/docs/2.0/configuration-reference/#jobs
jobs:
  run-current-branch:
    # Specify the execution environment. You can specify an image from Dockerhub or use one of our Convenience Images from CircleCI's Developer Hub.
    # See: https://circleci.com/docs/2.0/configuration-reference/#docker-machine-macos-windows-executor
    docker:
      - image: cimg/base:stable
    resource_class: small
    # Seqera workspace + compute environment are sourced from the CODEBASE (this file),
    # per-branch, NOT from shared CircleCI project env vars. Each commit therefore launches
    # on the compute environment that matches its own pipeline version, and a merge carries
    # the right CE with it (no manual CircleCI env-var flip). Secrets and private storage
    # locations remain CircleCI project env vars. The Nextflow version is likewise pinned in
    # the launch JSON below (preRunScript), so version + CE + workspace travel with the commit.
    # These two IDs are deliberately in this PUBLIC repo: they are opaque identifiers, inert
    # without TOWER_AUTH_TOKEN, and must travel with the commit for the above to work. Do not
    # "fix" them into CircleCI env vars.
    environment:
      TOWER_WORKSPACE_ID: "40027684065767"
      TOWER_COMPUTE_ENV_ID: "ed0zjbIeIvKoUPuGsy8fA"
    # Add steps to the job
    # See: https://circleci.com/docs/2.0/configuration-reference/#steps
    steps:
      - checkout
      - run:
          name: Create the NAME environment variable
          command: |
            echo "BASH_ENV is $BASH_ENV"
            NAME=$(echo CI_$(echo $CIRCLE_SHA1 | cut -c -7)_$(date +"%H_%M_%S"))
            echo "NAME is $NAME"
            echo "export NAME=$NAME" >> "$BASH_ENV"
            echo "BASH_ENV is $BASH_ENV"
      - run:
          name: Create a new endpoint for the current branch
          command: |
            : "${TOWER_WORK_DIR:?Configure TOWER_WORK_DIR as a private CircleCI environment variable}"
            myvar=`curl -X POST "https://api.tower.nf/actions?workspaceId=$TOWER_WORKSPACE_ID" \
            -H "Accept: application/json" \
            -H "Authorization: Bearer $TOWER_AUTH_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"name":"'"$NAME"'","source":"tower","launch":{"configProfiles":["test"], "computeEnvId":"'"$TOWER_COMPUTE_ENV_ID"'","pipeline":"https://github.com/csgenetics/csgenetics_scrnaseq","workDir":"'"$TOWER_WORK_DIR"'","revision":"'"$CIRCLE_SHA1"'","pullLatest":true,"preRunScript":"export NXF_VER=26.04.1"}}'`
            id=`echo $myvar | awk -F: {'print $2'} | sed 's/}//g'`
            echo "export ACTION_ID=$id" >> $BASH_ENV
            echo $id
      - run:
          name: Start the pipeline using the newly created endpoint
          command: |
            : "${PIPELINE_OUTDIR_ROOT:?Configure PIPELINE_OUTDIR_ROOT as a private CircleCI environment variable}"
            echo "NAME is $NAME"
            SHA=$NAME
            echo $NAME
            outdir="${PIPELINE_OUTDIR_ROOT%/}/circleci/${NAME}"
            myvar=`curl -X POST "https://api.tower.nf/actions/$ACTION_ID/launch?workspaceId=$TOWER_WORKSPACE_ID" \
            -H "Authorization: Bearer $TOWER_AUTH_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"params":{"outdir":"'"$outdir"'"}}'`
            WORKFLOW_ID=`echo $myvar | awk -F: '{print $2}' | sed 's/}//g' | sed 's/"//g'`
            echo $WORKFLOW_ID
            echo "export WORKFLOW_ID=$WORKFLOW_ID" >> $BASH_ENV
      - run:
          name: Monitor pipeline execution
          command: |
            status=`curl -X GET "https://api.tower.nf/workflow/$WORKFLOW_ID?workspaceId=$TOWER_WORKSPACE_ID" \
            -H "Authorization: Bearer $TOWER_AUTH_TOKEN" \
            -H "Content-Type: application/json" | jq '.workflow.status' | sed 's/"//g'`
            echo $status
            while [[ "$status" != "SUCCEEDED" ]]; do
              if [ "$status" = "CANCELLED" ]; then
                echo "run was cancelled, deleting endpoint"
                curl -X DELETE "https://api.tower.nf/actions/$ACTION_ID?workspaceId=$TOWER_WORKSPACE_ID" \
                -H "Authorization: Bearer $TOWER_AUTH_TOKEN" \
                -H "Accept: application/json"
                exit 1
              fi
              if [ "$status" = "FAILED" ]; then
                echo "run failed"
                curl -X DELETE "https://api.tower.nf/actions/$ACTION_ID?workspaceId=$TOWER_WORKSPACE_ID" \
                -H "Authorization: Bearer $TOWER_AUTH_TOKEN" \
                -H "Accept: application/json"
                exit 1
              fi
              sleep 60
              status=`curl -X GET "https://api.tower.nf/workflow/$WORKFLOW_ID?workspaceId=$TOWER_WORKSPACE_ID" \
              -H "Authorization: Bearer $TOWER_AUTH_TOKEN" \
              -H "Content-Type: application/json" | jq '.workflow.status' | sed 's/"//g'`
            done
      - run:
          name: Delete the newly created endpoint
          command: |
            curl -X DELETE "https://api.tower.nf/actions/$ACTION_ID?workspaceId=$TOWER_WORKSPACE_ID" \
            -H "Authorization: Bearer $TOWER_AUTH_TOKEN" \
            -H "Accept: application/json"

  # Fast structural test: runs the whole pipeline in -stub mode (no real data,
  # no AWS credentials needed - the S3 download processes are stubbed), plus the
  # per-process module tests. Catches wiring / output-declaration regressions.
  nf-test:
    machine:
      image: ubuntu-2204:current
    resource_class: large
    steps:
      - checkout
      - run:
          name: Install Java 17, Nextflow, nf-test
          command: |
            sudo apt-get update -y && sudo apt-get install -y openjdk-17-jre-headless
            curl -s https://get.nextflow.io | bash && sudo mv nextflow /usr/local/bin/
            curl -fsSL https://get.nf-test.com | bash && sudo mv nf-test /usr/local/bin/
      - run:
          name: nf-test (whole-pipeline -stub DAG test + module tests)
          command: |
            export NXF_VER=26.04.1
            nf-test test tests/nf/pipeline_stub.nf.test modules/local/save_resolved_configuration/tests/main.nf.test --verbose

  # General release gate for every Python test in tests/python, including tests added by
  # later hardening tickets. The output comparator owns a separate locked environment and
  # CI job, so it is the only ignored test file. Playwright is deliberately absent here:
  # browser assertions remain in report-production-container/report-smoke, while their
  # non-browser report contracts still run in this suite.
  python-tests:
    docker:
      - image: cimg/base:stable
    resource_class: medium
    steps:
      - checkout
      - install-pinned-pixi
      - restore_cache:
          keys:
            - python-tests-pixi-v1-{{ checksum "tests/requirements/python/pixi.lock" }}-{{ checksum "tests/requirements/gtfparse/pixi.lock" }}
      - run:
          name: Verify locks and install frozen Python environments
          command: |
            pixi lock --check \
              --manifest-path tests/requirements/python/pixi.toml
            pixi lock --check \
              --manifest-path tests/requirements/gtfparse/pixi.toml
            pixi install --frozen \
              --manifest-path tests/requirements/python/pixi.toml
            pixi install --frozen \
              --manifest-path tests/requirements/gtfparse/pixi.toml
      - run:
          name: Frozen general Python suite
          command: |
            pixi run --frozen \
              --manifest-path tests/requirements/python/pixi.toml \
              python -m pytest tests/python \
                --ignore=tests/python/test_compare_outputs.py \
                -v
      - save_cache:
          key: python-tests-pixi-v1-{{ checksum "tests/requirements/python/pixi.lock" }}-{{ checksum "tests/requirements/gtfparse/pixi.lock" }}
          paths:
            - tests/requirements/python/.pixi
            - tests/requirements/gtfparse/.pixi

  # This repo is PUBLIC. Fails the build if agent working files, ad-hoc internal sample
  # sheets, credentials, private S3 endpoints or beast-local paths get committed. See
  # CLAUDE.md for the remaining human-review checks. Deliberately dependency-free.
  check-no-internal-files:
    docker:
      - image: cimg/base:stable
    resource_class: small
    steps:
      - checkout
      - run:
          name: No internal-only files, credentials or private endpoints
          command: |
            tests/check_no_internal_files.sh
            tests/check_no_internal_files_test.sh

  # Exercise report parsing and generation in the exact image configured for the
  # three production report processes. That image currently carries Python 3.13.1;
  # install pytest only as CI tooling and do not replace any runtime dependency.
  # Persist one image-generated report so the separate Chromium job renders the
  # actual artifact rather than merely regenerating it in its Python 3.11 host.
  report-production-container:
    docker:
      - image: quay.io/csgenetics/html_build:0.1.0
    resource_class: medium
    steps:
      - checkout
      - run:
          name: Verify configured report runtime and install test runner
          command: |
            python --version
            python -m pip install --quiet pytest
      - run:
          name: Production-container report contract tests
          command: |
            python -m pytest \
              tests/python/test_report_smoke.py \
              tests/python/test_number_formatting.py \
              tests/python/test_cell_caller.py \
              tests/python/test_qc_cascade_offline.py \
              -v
      - run:
          name: Generate report artifact in production container
          command: |
            runtime_repo_dir="$PWD"
            runtime_report_dir="/tmp/csgenetics-report-runtime/container_report"
            mkdir -p "$runtime_report_dir"
            cp tests/python/fixtures/report/* "$runtime_report_dir/"
            cd "$runtime_report_dir"
            python "$runtime_repo_dir/bin/create_consolidated_report.py" \
              "$runtime_repo_dir/templates/consolidated_report_template.html.jinja2" \
              FALSE \
              "$runtime_repo_dir/assets/vendor" \
              "$runtime_report_dir/multisample_qc_cascade.html"
            test -s consolidated_report.html
            test -s multisample_out.csv
      - persist_to_workspace:
          root: /tmp/csgenetics-report-runtime
          paths:
            - container_report/consolidated_report.html

  # The declared Conda report environment uses Python 3.11, so retain a matching
  # host lane with system Chromium. It generates its own report and also renders
  # the artifact persisted by report-production-container. Assertions cover no JS
  # errors or network requests, every Plotly chart drawing, selector/print behavior,
  # standalone Cell Caller and QC-cascade pages, and the strict fragment/CSP boundary.
  report-smoke:
    docker:
      - image: cimg/python:3.11
    resource_class: medium
    steps:
      - checkout
      - attach_workspace:
          at: /tmp/csgenetics-report-runtime
      - run:
          name: Install report deps + headless Chromium
          command: |
            pip install --quiet \
              "anndata==0.11.3" \
              "h5py==3.12.1" \
              "jinja2==3.1.5" \
              "natsort==7.1.1" \
              "numpy==2.2.1" \
              "pandas==2.2.3" \
              "plotly==5.24.1" \
              "scipy==1.15.1" \
              playwright \
              pytest
            python -m playwright install --with-deps chromium
      - run:
          name: Consolidated and standalone offline-report tests
          command: |
            CSGENETICS_PRODUCTION_CONTAINER_REPORT=/tmp/csgenetics-report-runtime/container_report/consolidated_report.html \
            python -m pytest \
              tests/python/test_report_smoke.py \
              tests/python/test_number_formatting.py \
              tests/python/test_cell_caller.py \
              tests/python/test_qc_cascade_offline.py \
              -v


# Invoke jobs via workflows
# See: https://circleci.com/docs/2.0/configuration-reference/#workflows
# NOTE: the run-current-branch (Seqera Tower) job needs three CircleCI project env vars:
# TOWER_AUTH_TOKEN (secret), TOWER_WORK_DIR and PIPELINE_OUTDIR_ROOT (private locations).
# The workspace and compute-env IDs remain codebase-controlled in the job's `environment:`
# block above, so no version-specific CircleCI env var needs flipping between branches.
workflows:
  ci:
    jobs:
      - check-no-internal-files
      - nf-test
      - python-tests
      - report-production-container
      - report-smoke:
          requires:
            - report-production-container
      - run-current-branch
