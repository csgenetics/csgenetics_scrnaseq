# Use the latest 2.1 version of CircleCI pipeline process engine.
# See: https://circleci.com/docs/2.0/configuration-reference
version: 2.1

# Pipeline parameters for the maintainer trigger (GRT-1405). Empty defaults mean
# a push/tag pipeline. A non-empty launch_sha selects seqera-on-demand instead
# of ci; that workflow only runs when the pipeline itself was started from devel,
# so the job definition is devel's, not the SHA being tested.
parameters:
  launch_sha:
    type: string
    default: ""
  launch_revision:
    type: string
    default: ""


# Install the same reviewed Pixi release in every locked-environment job. Keep this as a
# reusable command so the comparator and general Python gates cannot drift onto different
# installers when their branches are integrated.
commands:
  install-pinned-pixi:
    steps:
      - run:
          name: Install pinned Pixi 0.47.0
          command: |
            readonly pixi_version="0.47.0"
            readonly pixi_archive="/tmp/pixi-x86_64-unknown-linux-musl.tar.gz"
            readonly pixi_sha256="9ca7b313a814f7ffc4bdc673f8fddef48a525a3d5da2e592559ba6ade8709e92"
            curl --fail --location --silent --show-error \
              --output "$pixi_archive" \
              "https://github.com/prefix-dev/pixi/releases/download/v${pixi_version}/pixi-x86_64-unknown-linux-musl.tar.gz"
            echo "$pixi_sha256  $pixi_archive" | sha256sum --check --strict
            tar -xzf "$pixi_archive" -C /tmp pixi
            test "$(/tmp/pixi --version)" = "pixi $pixi_version"
            sudo install -m 0755 /tmp/pixi /usr/local/bin/pixi

# Define a job to be invoked later in a workflow.
# See: https://circleci.com/docs/2.0/configuration-reference/#jobs
jobs:
  run-current-branch:
    # Specify the execution environment. You can specify an image from Dockerhub or use one of our Convenience Images from CircleCI's Developer Hub.
    # See: https://circleci.com/docs/2.0/configuration-reference/#docker-machine-macos-windows-executor
    docker:
      - image: cimg/base:stable
    resource_class: small
    # Seqera workspace + compute environment are sourced from the CODEBASE (this file),
    # per-branch, NOT from shared CircleCI project env vars. Each commit therefore launches
    # on the compute environment that matches its own pipeline version, and a merge carries
    # the right CE with it (no manual CircleCI env-var flip). Secrets and private storage
    # locations remain CircleCI project env vars. The Nextflow version is likewise pinned by
    # the launcher below, so version + CE + workspace travel with the commit.
    # These two IDs are deliberately in this PUBLIC repo: they are opaque identifiers, inert
    # without TOWER_AUTH_TOKEN, and must travel with the commit for the above to work. Do not
    # "fix" them into CircleCI env vars.
    environment:
      TOWER_WORKSPACE_ID: "40027684065767"
      TOWER_COMPUTE_ENV_ID: "ed0zjbIeIvKoUPuGsy8fA"
    # Add steps to the job
    # See: https://circleci.com/docs/2.0/configuration-reference/#steps
    steps:
      - run:
          name: Install AWS CLI
          command: |
            curl -s "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o awscliv2.zip
            unzip -q awscliv2.zip
            sudo ./aws/install
      - run:
          # GRT-1406. Fetches the Seqera token from AWS per job, so this PUBLIC repo's CircleCI
          # project stores no long-lived Tower token at all.
          #
          # INLINE, NOT A SCRIPT FROM THE REPO, AND THAT IS THE WHOLE POINT. This job
          # deliberately has no `checkout`: GRT-1405 removed it because the job holds a
          # credential while it runs, and on a public repo any branch could otherwise change
          # what executes. Calling a repo script here would hand that back.
          #
          # NO HEREDOCS AND NO HERESTRINGS. Double-angle-bracket is CircleCI parameter syntax in
          # this file, and either shell form breaks the config. This comment deliberately spells
          # that out in words rather than showing the characters, because CircleCI preprocesses
          # them even inside a comment.
          #
          # The assumed credentials are confined to the single command that needs them by an
          # environment prefix, so they never enter the job environment. This job holds no
          # static AWS key pair at all -- assuming a role with a web identity needs none -- and
          # it should stay that way.
          name: Fetch Tower token via OIDC (never printed)
          command: |
            set -Eeuo pipefail
            role_arn="arn:aws:iam::837012689225:role/circleci-oidc-csgenetics-scrnaseq"
            sid="seqera/csgenetics_scrnaseq/tower-access-token"
            region="us-east-1"
            if [[ -z ${CIRCLE_OIDC_TOKEN_V2:-} ]]; then
              echo "FAIL: CIRCLE_OIDC_TOKEN_V2 is empty; cannot assume the OIDC role." >&2
              echo "      V1 carries no vcs claims, so this does not fall back to it." >&2
              exit 1
            fi
            if [[ -z ${BASH_ENV:-} ]]; then
              echo "FAIL: BASH_ENV is unset; cannot pass the token to the launcher step." >&2
              exit 1
            fi
            creds=$(aws sts assume-role-with-web-identity \
              --role-arn "$role_arn" \
              --role-session-name "${CIRCLE_JOB:-circleci}" \
              --web-identity-token "$CIRCLE_OIDC_TOKEN_V2" \
              --duration-seconds 3600 --region "$region" \
              --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]' --output text)
            tok=$(AWS_ACCESS_KEY_ID=$(printf '%s' "$creds" | cut -f1) \
                  AWS_SECRET_ACCESS_KEY=$(printf '%s' "$creds" | cut -f2) \
                  AWS_SESSION_TOKEN=$(printf '%s' "$creds" | cut -f3) \
                  aws secretsmanager get-secret-value --secret-id "$sid" \
                    --region "$region" --query SecretString --output text)
            unset creds
            tok=${tok%$'\n'}
            if [[ -z $tok ]]; then
              echo "FAIL: Secrets Manager returned an empty SecretString" >&2
              exit 1
            fi
            printf 'export TOWER_AUTH_TOKEN=%q\n' "$tok" >> "$BASH_ENV"
            printf 'TOWER_AUTH_TOKEN from AWS: PRESENT len=%s sha256_16=%s\n' \
              "${#tok}" "$(printf '%s' "$tok" | sha256sum | cut -c1-16)"
      - run:
          name: Launch and monitor exact revision on Seqera Platform
          command: |
            set -Eeuo pipefail
            # Prelude: resolve the Seqera pin from pipeline parameters or
            # CircleCI's git values. Empty CircleCI interpolations can appear
            # as <nil> if they ever land in environment:; keep them in-shell.
            # This prelude is outside the drift-checked body.
            launch_sha='<< pipeline.parameters.launch_sha >>'
            launch_revision='<< pipeline.parameters.launch_revision >>'
            if [[ $launch_sha == '<nil>' ]]; then
              launch_sha=''
            fi
            if [[ $launch_revision == '<nil>' ]]; then
              launch_revision=''
            fi
            if [[ -n $launch_sha ]]; then
              export SEQERA_COMMIT_ID=$launch_sha
              if [[ -n $launch_revision ]]; then
                export SEQERA_REVISION=$launch_revision
              else
                export SEQERA_REVISION=$launch_sha
              fi
            else
              export SEQERA_COMMIT_ID=${CIRCLE_SHA1-}
              if [[ -n ${CIRCLE_TAG-} ]]; then
                export SEQERA_REVISION=$CIRCLE_TAG
              else
                export SEQERA_REVISION=${CIRCLE_BRANCH-}
              fi
            fi
            # BEGIN_SEQERA_RELEASE_GATE
            #!/usr/bin/env bash
            
            # Launch a pinned revision on Seqera Platform, wait for a terminal result, and
            # remove the temporary action. This script deliberately owns the complete
            # lifecycle in one shell so EXIT/TERM cleanup can cancel an incomplete workflow
            # and delete its action. It does not read the git checkout: SEQERA_COMMIT_ID and
            # SEQERA_REVISION are the pin (supplied by the CircleCI job prelude).
            
            set -Eeuo pipefail
            
            readonly seqera_api_base='https://api.cloud.seqera.io'
            readonly pipeline_url='https://github.com/csgenetics/csgenetics_scrnaseq'
            readonly nextflow_version='26.04.1'
            
            action_id=''
            workflow_id=''
            workflow_terminal=0
            launch_attempted=0
            scratch_dir=''
            auth_header_file=''
            
            error() {
              printf 'ERROR: %s\n' "$1" >&2
            }
            
            die() {
              error "$1"
              exit 1
            }
            
            require_environment_variable() {
              local name=$1
            
              if [[ -z ${!name-} ]]; then
                die "Required environment variable ${name} is not configured."
              fi
              if [[ ${!name} == *$'\n'* || ${!name} == *$'\r'* ]]; then
                die "Required environment variable ${name} contains a line break."
              fi
            }
            
            valid_seqera_id() {
              local value=$1
            
              [[ $value =~ ^[A-Za-z0-9_-]+$ && ${#value} -le 128 ]]
            }
            
            api_json_request() {
              local label=$1
              local method=$2
              local path=$3
              local request_body=$4
              local response_file=$5
              local request_timeout=${6:-120}
              local -a curl_arguments=(
                --disable
                --fail
                --silent
                --show-error
                --proto '=https'
                --tlsv1.2
                --connect-timeout 30
                --max-time "$request_timeout"
                --request "$method"
                --url "${seqera_api_base}${path}"
                --header "@${auth_header_file}"
                --header 'Accept: application/json'
                --header 'Accept-Version: 1'
                --output "$response_file"
              )
            
              if [[ -n $request_body ]]; then
                curl_arguments+=(
                  --header 'Content-Type: application/json'
                  --data-binary "@${request_body}"
                )
              fi
            
              if ! curl "${curl_arguments[@]}"; then
                error "Seqera API ${label} request failed."
                return 1
              fi
              if ! jq -e . "$response_file" >/dev/null 2>&1; then
                error "Seqera API ${label} returned malformed JSON."
                return 1
              fi
            }
            
            cleanup_api_request() {
              local label=$1
              local method=$2
              local path=$3
              local request_body=${4-}
              local -a curl_arguments=(
                --disable
                --fail
                --silent
                --show-error
                --proto '=https'
                --tlsv1.2
                --connect-timeout 10
                --max-time 30
                --request "$method"
                --url "${seqera_api_base}${path}"
                --header "@${auth_header_file}"
                --header 'Accept: application/json'
                --header 'Accept-Version: 1'
                --output /dev/null
              )
            
              if [[ -n $request_body ]]; then
                curl_arguments+=(
                  --header 'Content-Type: application/json'
                  --data "$request_body"
                )
              fi
            
              if ! curl "${curl_arguments[@]}"; then
                error "Seqera API ${label} cleanup request failed."
                return 1
              fi
            }
            
            cleanup() {
              local original_status=$?
              local cleanup_status=0
              local recovered_workflow_id=''
              local recovery_response=''
            
              trap - EXIT
              trap '' HUP INT TERM
              set +e
            
              if [[ -z $workflow_id && -n $action_id && $launch_attempted -eq 1 ]]; then
                recovery_response="${scratch_dir}/describe-action.response.json"
                if api_json_request \
                  'describe action during cleanup' \
                  GET \
                  "/actions/${action_id}?workspaceId=${TOWER_WORKSPACE_ID}" \
                  '' \
                  "$recovery_response" \
                  20; then
                  recovered_workflow_id=$(
                    jq -er '.action.event.workflowId | select(type == "string")' \
                      "$recovery_response" 2>/dev/null
                  )
                  if valid_seqera_id "$recovered_workflow_id"; then
                    workflow_id=$recovered_workflow_id
                    printf 'Recovered the launched workflow identifier during cleanup.\n'
                  fi
                fi
              fi
            
              if [[ -n $workflow_id && $workflow_terminal -eq 0 ]]; then
                if cleanup_api_request \
                  'cancel workflow' \
                  POST \
                  "/workflow/${workflow_id}/cancel?workspaceId=${TOWER_WORKSPACE_ID}" \
                  '{}'; then
                  printf 'Requested cancellation of incomplete Seqera workflow.\n'
                else
                  cleanup_status=1
                fi
              fi
            
              if [[ -n $action_id ]]; then
                if cleanup_api_request \
                  'delete action' \
                  DELETE \
                  "/actions/${action_id}?workspaceId=${TOWER_WORKSPACE_ID}"; then
                  printf 'Deleted temporary Seqera action.\n'
                else
                  cleanup_status=1
                fi
              fi
            
              if [[ -n $scratch_dir ]]; then
                rm -rf -- "$scratch_dir"
              fi
            
              if [[ $original_status -eq 0 && $cleanup_status -ne 0 ]]; then
                exit "$cleanup_status"
              fi
              exit "$original_status"
            }
            
            interrupted() {
              local signal_name=$1
            
              error "Seqera release gate interrupted by ${signal_name}."
              exit 1
            }
            
            trap cleanup EXIT
            trap 'interrupted HUP' HUP
            trap 'interrupted INT' INT
            trap 'interrupted TERM' TERM
            
            for required_name in \
              TOWER_AUTH_TOKEN \
              TOWER_WORK_DIR \
              PIPELINE_OUTDIR_ROOT \
              TOWER_WORKSPACE_ID \
              TOWER_COMPUTE_ENV_ID \
              SEQERA_COMMIT_ID \
              SEQERA_REVISION \
              CIRCLE_BUILD_NUM; do
              require_environment_variable "$required_name"
            done
            
            [[ $TOWER_WORKSPACE_ID =~ ^[0-9]+$ ]] || \
              die 'TOWER_WORKSPACE_ID must be a numeric workspace identifier.'
            valid_seqera_id "$TOWER_COMPUTE_ENV_ID" || \
              die 'TOWER_COMPUTE_ENV_ID is not a valid Seqera identifier.'
            [[ $SEQERA_COMMIT_ID =~ ^[0-9a-fA-F]{40}$ ]] || \
              die 'SEQERA_COMMIT_ID must be a full 40-character Git commit hash.'
            [[ $CIRCLE_BUILD_NUM =~ ^[0-9]+$ ]] || \
              die 'CIRCLE_BUILD_NUM must be numeric.'
            [[ ${#SEQERA_REVISION} -le 255 ]] || \
              die 'SEQERA_REVISION exceeds the supported length.'
            
            readonly poll_interval_seconds=${SEQERA_POLL_INTERVAL_SECONDS:-60}
            # Heavy validated fixtures have taken over three hours. Allow 4.5 hours while
            # retaining a 30-minute cleanup margin below CircleCI Scale's five-hour job cap.
            readonly poll_timeout_seconds=${SEQERA_POLL_TIMEOUT_SECONDS:-16200}
            [[ $poll_interval_seconds =~ ^[1-9][0-9]*$ ]] || \
              die 'SEQERA_POLL_INTERVAL_SECONDS must be a positive integer.'
            [[ $poll_timeout_seconds =~ ^[0-9]+$ ]] || \
              die 'SEQERA_POLL_TIMEOUT_SECONDS must be a non-negative integer.'
            
            umask 077
            scratch_dir=$(mktemp -d)
            auth_header_file="${scratch_dir}/authorization.header"
            printf 'Authorization: Bearer %s\n' "$TOWER_AUTH_TOKEN" > "$auth_header_file"
            
            readonly action_response="${scratch_dir}/create-action.response.json"
            readonly launch_response="${scratch_dir}/launch-action.response.json"
            readonly workflow_response="${scratch_dir}/workflow.response.json"
            readonly action_payload="${scratch_dir}/create-action.request.json"
            readonly launch_payload="${scratch_dir}/launch-action.request.json"
            readonly run_name="CI_${SEQERA_COMMIT_ID:0:7}_${CIRCLE_BUILD_NUM}"
            readonly output_directory="${PIPELINE_OUTDIR_ROOT%/}/circleci/${run_name}"
            
            # Seqera models these separately: revision preserves branch/tag context,
            # commitId pins its exact commit, and pullLatest=false keeps that pin.
            if ! jq -n \
              --arg name "$run_name" \
              --arg compute_environment_id "$TOWER_COMPUTE_ENV_ID" \
              --arg pipeline "$pipeline_url" \
              --arg work_directory "$TOWER_WORK_DIR" \
              --arg revision "$SEQERA_REVISION" \
              --arg commit_id "$SEQERA_COMMIT_ID" \
              --arg nextflow_version "$nextflow_version" \
              '{
                name: $name,
                source: "tower",
                launch: {
                  configProfiles: ["test"],
                  computeEnvId: $compute_environment_id,
                  pipeline: $pipeline,
                  workDir: $work_directory,
                  revision: $revision,
                  commitId: $commit_id,
                  pullLatest: false,
                  preRunScript: ("export NXF_VER=" + $nextflow_version)
                }
              }' > "$action_payload"; then
              die 'Unable to construct the Seqera action request.'
            fi
            
            api_json_request \
              'create action' \
              POST \
              "/actions?workspaceId=${TOWER_WORKSPACE_ID}" \
              "$action_payload" \
              "$action_response" || exit 1
            
            if ! candidate_action_id=$(
              jq -er '.actionId | select(type == "string")' "$action_response" 2>/dev/null
            ); then
              die 'Seqera create-action response did not contain a string actionId.'
            fi
            valid_seqera_id "$candidate_action_id" || \
              die 'Seqera create-action response contained an invalid actionId.'
            action_id=$candidate_action_id
            
            if ! jq -n \
              --arg output_directory "$output_directory" \
              '{params: {outdir: $output_directory}}' > "$launch_payload"; then
              die 'Unable to construct the Seqera launch request.'
            fi
            
            launch_attempted=1
            api_json_request \
              'launch action' \
              POST \
              "/actions/${action_id}/launch?workspaceId=${TOWER_WORKSPACE_ID}" \
              "$launch_payload" \
              "$launch_response" || exit 1
            
            if ! candidate_workflow_id=$(
              jq -er '.workflowId | select(type == "string")' "$launch_response" 2>/dev/null
            ); then
              die 'Seqera launch-action response did not contain a string workflowId.'
            fi
            valid_seqera_id "$candidate_workflow_id" || \
              die 'Seqera launch-action response contained an invalid workflowId.'
            workflow_id=$candidate_workflow_id
            
            printf 'Seqera workflow submitted for the pinned commit.\n'
            SECONDS=0
            
            while true; do
              api_json_request \
                'describe workflow' \
                GET \
                "/workflow/${workflow_id}?workspaceId=${TOWER_WORKSPACE_ID}" \
                '' \
                "$workflow_response" || exit 1
            
              if ! workflow_status=$(
                jq -er '.workflow.status | select(type == "string")' \
                  "$workflow_response" 2>/dev/null
              ); then
                die 'Seqera describe-workflow response did not contain a string workflow status.'
              fi
              if ! observed_commit_id=$(
                jq -er '(.workflow.commitId // "") | select(type == "string")' \
                  "$workflow_response" 2>/dev/null
              ); then
                die 'Seqera describe-workflow response contained a malformed commitId.'
              fi
              case "$workflow_status" in
                SUCCEEDED|FAILED|CANCELLED) workflow_terminal=1 ;;
              esac
              if [[ -n $observed_commit_id && ${observed_commit_id,,} != "${SEQERA_COMMIT_ID,,}" ]]; then
                die 'Seqera reported a workflow commit that differs from SEQERA_COMMIT_ID.'
              fi
            
              printf 'Seqera workflow status: %s (elapsed %ss).\n' "$workflow_status" "$SECONDS"
              case "$workflow_status" in
                SUCCEEDED)
                  if [[ -z $observed_commit_id ]]; then
                    die 'Succeeded Seqera workflow did not report its executed commitId.'
                  fi
                  printf 'Seqera workflow succeeded at the pinned commit.\n'
                  break
                  ;;
                FAILED)
                  die 'Seqera workflow failed.'
                  ;;
                CANCELLED)
                  die 'Seqera workflow was cancelled.'
                  ;;
                UNKNOWN)
                  die 'Seqera workflow entered UNKNOWN status.'
                  ;;
                SUBMITTED|RUNNING)
                  if (( SECONDS >= poll_timeout_seconds )); then
                    die "Seqera workflow exceeded the ${poll_timeout_seconds}s polling deadline."
                  fi
                  ;;
                *)
                  die 'Seqera workflow returned an unexpected status.'
                  ;;
              esac
            
              sleep "$poll_interval_seconds"
            done
            # END_SEQERA_RELEASE_GATE

  # Fast structural test: runs the whole pipeline in -stub mode (no real data,
  # no AWS credentials needed - the S3 download processes are stubbed), plus the
  # per-process module tests. Catches wiring / output-declaration regressions.
  nf-test:
    machine:
      image: ubuntu-2204:current
    resource_class: large
    steps:
      - checkout
      - run:
          name: Install Java 17, Nextflow, nf-test
          command: |
            sudo apt-get update -y && sudo apt-get install -y openjdk-17-jre-headless
            curl -s https://get.nextflow.io | bash && sudo mv nextflow /usr/local/bin/
            curl -fsSL https://get.nf-test.com | bash && sudo mv nf-test /usr/local/bin/
      - run:
          name: Configured STAR container runtime contract
          command: tests/test_star_container_runtime.sh
      - run:
          name: nf-test (whole-pipeline -stub DAG test + module tests)
          command: |
            export NXF_VER=26.04.1
            nf-test test \
              tests/nf/pipeline_stub.nf.test \
              modules/local/consolidated_report/tests/main.nf.test \
              modules/local/initial_feature_count/tests/main.nf.test \
              modules/local/merge_annotated_UMRs_with_annotated_multimappers/tests/main.nf.test \
              modules/local/run_rseqc/tests/main.nf.test \
              modules/local/save_resolved_configuration/tests/main.nf.test \
              --verbose

  # General release gate for every Python test in tests/python, including tests added by
  # later hardening tickets. The output comparator owns a separate locked environment and
  # CI job, so it is the only ignored test file. Playwright is deliberately absent here:
  # browser assertions remain in report-production-container/report-smoke, while their
  # non-browser report contracts still run in this suite.
  python-tests:
    docker:
      - image: cimg/base:stable
    resource_class: medium
    steps:
      - checkout
      - install-pinned-pixi
      - restore_cache:
          keys:
            - python-tests-pixi-v1-{{ checksum "tests/requirements/python/pixi.lock" }}-{{ checksum "tests/requirements/gtfparse/pixi.lock" }}
      - run:
          name: Verify locks and install frozen Python environments
          command: |
            pixi lock --check \
              --manifest-path tests/requirements/python/pixi.toml
            pixi lock --check \
              --manifest-path tests/requirements/gtfparse/pixi.toml
            pixi install --frozen \
              --manifest-path tests/requirements/python/pixi.toml
            pixi install --frozen \
              --manifest-path tests/requirements/gtfparse/pixi.toml
      - run:
          name: Frozen general Python suite
          command: |
            pixi run --frozen \
              --manifest-path tests/requirements/python/pixi.toml \
              python -m pytest tests/python \
                --ignore=tests/python/test_compare_outputs.py \
                -v
      - save_cache:
          key: python-tests-pixi-v1-{{ checksum "tests/requirements/python/pixi.lock" }}-{{ checksum "tests/requirements/gtfparse/pixi.lock" }}
          paths:
            - tests/requirements/python/.pixi
            - tests/requirements/gtfparse/.pixi

  # This repo is PUBLIC. Fails the build if agent working files, ad-hoc internal sample
  # sheets, credentials, private S3 endpoints or beast-local paths get committed. See
  # CLAUDE.md for the remaining human-review checks. Deliberately dependency-free.
  check-no-internal-files:
    docker:
      - image: cimg/base:stable
    resource_class: small
    steps:
      - checkout
      - run:
          name: No internal-only files, credentials or private endpoints
          command: |
            tests/check_no_internal_files.sh
            tests/check_no_internal_files_test.sh
            tests/test_seqera_release_gate.sh

  # The release comparator is itself a release gate. Exercise every file-class
  # contract with a locked Python/anndata/scipy/samtools environment so a missing
  # optional reader can never turn validation into a silent skip.
  comparator-tests:
    docker:
      - image: cimg/base:stable
    resource_class: medium
    steps:
      - checkout
      - install-pinned-pixi
      - restore_cache:
          keys:
            - comparator-tests-pixi-v1-{{ checksum "tests/requirements/comparator/pixi.lock" }}
      - run:
          name: Verify lock and install frozen comparator environment
          command: |
            pixi lock --check \
              --manifest-path tests/requirements/comparator/pixi.toml
            pixi install --frozen \
              --manifest-path tests/requirements/comparator/pixi.toml
      - run:
          name: Comparator adversarial tests
          command: |
            pixi run --frozen \
              --manifest-path tests/requirements/comparator/pixi.toml \
              python -m pytest tests/python/test_compare_outputs.py -v
      - save_cache:
          key: comparator-tests-pixi-v1-{{ checksum "tests/requirements/comparator/pixi.lock" }}
          paths:
            - tests/requirements/comparator/.pixi

  # The production io_count process executes a committed static binary. Compile
  # its dependency-free Rust source with the reviewed toolchain, run the source
  # unit tests, and require the stripped musl artifact to match byte-for-byte.
  io-count-extract:
    docker:
      - image: cimg/rust:1.93.0
    resource_class: small
    steps:
      - checkout
      - run:
          name: Rust tests and committed binary parity
          command: tests/test_io_count_extract_build.sh

  # Exercise report parsing and generation in the exact image configured for the
  # three production report processes. That image currently carries Python 3.13.1;
  # install pytest only as CI tooling and do not replace any runtime dependency.
  # Persist one image-generated report so the separate Chromium job renders the
  # actual artifact rather than merely regenerating it in its Python 3.11 host.
  report-production-container:
    docker:
      - image: quay.io/csgenetics/html_build:0.1.0
    resource_class: medium
    steps:
      - checkout
      - run:
          name: Verify configured report runtime and install test runner
          command: |
            python --version
            python -m pip install --quiet pytest
      - run:
          name: Production-container report contract tests
          command: |
            python -m pytest \
              tests/python/test_report_smoke.py \
              tests/python/test_number_formatting.py \
              tests/python/test_cell_caller.py \
              tests/python/test_qc_cascade_offline.py \
              -v
      - run:
          name: Generate report artifact in production container
          command: |
            runtime_repo_dir="$PWD"
            runtime_report_dir="/tmp/csgenetics-report-runtime/container_report"
            mkdir -p "$runtime_report_dir"
            cp tests/python/fixtures/report/* "$runtime_report_dir/"
            cd "$runtime_report_dir"
            python "$runtime_repo_dir/bin/create_consolidated_report.py" \
              "$runtime_repo_dir/templates/consolidated_report_template.html.jinja2" \
              FALSE \
              "$runtime_repo_dir/assets/vendor" \
              "$runtime_report_dir/multisample_qc_cascade.html"
            test -s consolidated_report.html
            test -s multisample_out.csv
      - persist_to_workspace:
          root: /tmp/csgenetics-report-runtime
          paths:
            - container_report/consolidated_report.html

  # The declared Conda report environment uses Python 3.11, so retain a matching
  # host lane with system Chromium. It generates its own report and also renders
  # the artifact persisted by report-production-container. Assertions cover no JS
  # errors or network requests, every Plotly chart drawing, selector/print behavior,
  # standalone Cell Caller and QC-cascade pages, and the strict fragment/CSP boundary.
  report-smoke:
    docker:
      - image: cimg/python:3.11
    resource_class: medium
    steps:
      - checkout
      - attach_workspace:
          at: /tmp/csgenetics-report-runtime
      - run:
          name: Install report deps + headless Chromium
          command: |
            pip install --quiet \
              "anndata==0.11.3" \
              "h5py==3.12.1" \
              "jinja2==3.1.5" \
              "natsort==7.1.1" \
              "numpy==2.2.1" \
              "pandas==2.2.3" \
              "plotly==5.24.1" \
              "scipy==1.15.1" \
              playwright \
              pytest
            python -m playwright install --with-deps chromium
      - run:
          name: Consolidated and standalone offline-report tests
          command: |
            CSGENETICS_PRODUCTION_CONTAINER_REPORT=/tmp/csgenetics-report-runtime/container_report/consolidated_report.html \
            python -m pytest \
              tests/python/test_report_smoke.py \
              tests/python/test_number_formatting.py \
              tests/python/test_cell_caller.py \
              tests/python/test_qc_cascade_offline.py \
              -v


# Invoke jobs via workflows
# See: https://circleci.com/docs/2.0/configuration-reference/#workflows
# NOTE: the run-current-branch (Seqera Tower) job needs three CircleCI project env vars:
# TOWER_AUTH_TOKEN (secret), TOWER_WORK_DIR and PIPELINE_OUTDIR_ROOT (private locations).
# The workspace and compute-env IDs remain codebase-controlled in the job's `environment:`
# block above, so no version-specific CircleCI env var needs flipping between branches.
#
# Maintainer e2e of a PR SHA (GRT-1405): Trigger Pipeline from branch `devel` with
# parameters launch_sha (40-char hex) and optional launch_revision. That runs the
# identical run-current-branch job definition compiled from devel, not from the
# SHA being tested. Triggering the PR's own branch is the hole this closes.
workflows:
  ci:
    unless: << pipeline.parameters.launch_sha >>
    jobs:
      - check-no-internal-files:
          filters:
            tags:
              only: /.*/
      - comparator-tests:
          filters:
            tags:
              only: /.*/
      - io-count-extract:
          filters:
            tags:
              only: /.*/
      - nf-test:
          filters:
            tags:
              only: /.*/
      - python-tests:
          filters:
            tags:
              only: /.*/
      - report-production-container:
          filters:
            tags:
              only: /.*/
      - report-smoke:
          requires:
            - report-production-container
          filters:
            tags:
              only: /.*/
      # THE ONLY CREDENTIALED JOB, AND THE ONLY ONE WITH A BRANCH FILTER (GRT-1405).
      #
      # It holds TOWER_AUTH_TOKEN and an AWS key pair. It does not checkout. The
      # launcher is this job definition, compiled from the pipeline's git ref
      # (devel or a version tag). CircleCI reads .circleci/ from that ref, so a
      # feature branch cannot reach this job, and an on-demand launch of a PR
      # SHA must start the pipeline from devel (see seqera-on-demand).
      #
      # WHAT THIS IS WORTH, STATED PLAINLY so nobody later mistakes it for more.
      # `devel` requires a pull request but `required_approving_review_count` is
      # 0, deliberately -- Ben decided on 2026-08-25 that he merges his own PRs.
      # The filter means "only someone with push access can cause the
      # credentialed job to run", which is two people. It does NOT mean "only
      # reviewed code runs with credentials". A version tag compiles THAT
      # commit's config.yml, not devel's; tags are not PR-protected. Arbitrary
      # tags are excluded because pushing an arbitrary tag at a feature SHA
      # would otherwise be the old every-branch exposure.
      #
      # The bound on what credentialed code could do lives in AWS (GRT-1404,
      # still open on egress). GRT-1406 retires the AWS key pair.
      - run-current-branch:
          filters:
            branches:
              only:
                - devel
            tags:
              only: /^[0-9]+\.[0-9]+\.[0-9]+$/
          requires:
            - check-no-internal-files
            - comparator-tests
            - io-count-extract
            - nf-test
            - python-tests
            - report-production-container
            - report-smoke

  seqera-on-demand:
    when:
      and:
        - << pipeline.parameters.launch_sha >>
        - equal: [devel, "<< pipeline.git.branch >>"]
    jobs:
      - run-current-branch
