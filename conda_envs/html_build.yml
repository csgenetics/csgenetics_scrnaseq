name: html_build
channels:
  - plotly
  - conda-forge
dependencies:
  - python =3.11
  - setuptools
  - pandas =2.2.3
  - numpy =2.2.1
  - scipy =1.15.1
  # Upgrades must be checked against create_consolidated_report.py's strict
  # _PLOTLY_SCRIPT_* parser contract and the offline browser smoke tests.
  - plotly =5.24.1
  - jinja2 =3.1.5
  - anndata =0.11.3
  - h5py =3.12.1
  - natsort =7.1.1
