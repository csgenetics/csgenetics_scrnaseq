[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --strict-markers
    --tb=short
markers =
    unit: Pure-logic unit tests (no heavy scanpy/anndata fixtures).
    integration: Tests that build/round-trip anndata, h5ad or run bin/ scripts as subprocesses.
